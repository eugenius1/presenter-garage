name: CI

on:
  # Every branch, so a check runs before anything reaches a pull request.
  # Branches only -- `push` would otherwise fire again for tags on commits
  # that have already been checked.
  push:
    branches: ["**"]
  pull_request:

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov authenticates the upload with a GitHub OIDC token, not a secret.
  id-token: write

jobs:
  check:
    # Pushes cover our own branches, so a same-repo pull request would just
    # duplicate the run its branch already triggered. Forks are the exception:
    # their pushes are invisible to us, so those PRs do need their own run.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nothing here launches the desktop app, so Electron's binary is not
      # fetched; the desktop job below does that on the systems it ships for.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Generates the proto descriptor, then lints, typechecks and tests.
      # Tests needing a real ProPresenter file skip here by design -- see
      # packages/core/src/lib/__tests__/fixtures.ts. CI=true also turns on
      # coverage.
      - run: npm run check

      - run: npm run build

      # Reporting, not a gate: a Codecov outage must not block a merge.
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false

  desktop:
    # A dev build of the desktop app launches on each system it is for (#30):
    # the page loads over the app's own scheme, finds its bridge, and the
    # main process opens SQLite. Signed installers are a later step.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run desktop:build

      - run: npm run smoke -w @presenter-garage/desktop
