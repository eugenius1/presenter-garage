name: Release

# Makes a release from a commit on main: the Claude Desktop extension attached
# to a GitHub release, and presenter-garage-mcp staged on npm. Two ways in:
#
# - The "Run workflow" button (workflow_dispatch) with patch, minor or major.
#   It works out the next version from the latest release, builds and checks
#   main at that version, and only then creates the release, with the
#   extension already on it.
# - Publishing a GitHub release by hand, tagged vX.Y.Z (or vX.Y.Z-beta.1).
#   The same build runs on the tagged commit, and the extension is added to
#   the release afterwards.
#
# The tag is the only place a version lives. Every package.json in the
# repository says 0.0.0, and the build stamps the tag's version into all of
# them before anything is built, so the server bundle, the extension's
# manifest and the npm tarball cannot disagree. Nothing is committed back.
#
# Every release gets the extension, whatever it is for: the app links to
# releases/latest/download/presenter-garage.mcpb, and "latest" is the newest
# release in the whole repository, so one release without the file would
# break that link for everyone.
#
# npm gets the version staged, not published: it waits on npmjs.com until a
# maintainer approves it with two-factor authentication (`npm stage
# approve`), so nothing reaches `npx` users on CI's word alone. npm
# authenticates this workflow through trusted publishing (OIDC), not a stored
# token; the trusted publisher names this file, so renaming it breaks
# publishing. See "Releasing" in CONTRIBUTING.md.
#
# Only the job that needs a permission holds it: `build` installs dependencies
# and runs their scripts with a read-only token, and the jobs that can write
# to the release or publish to npm install nothing from the project. No
# dependency cache either, so nothing another workflow saved reaches the files
# that get published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: minor

permissions: {}

# Runs of the button share one group, so two of them cannot read the same
# latest release and pick the same next version. A release published by hand
# gets a group of its own: GitHub keeps only one queued run per group and
# cancels the one before, which would leave a release without its extension.
concurrency:
  group: release-${{ github.event.release.tag_name || 'button' }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # npm's own version parser, pinned, rather than a hand-written
          # pattern: it prints the version without the v, or fails if the
          # input is not one.
          semver() { npx --yes semver@7.8.5 "$@"; }

          # A tag is used only if it is exactly v followed by a version:
          # semver also accepts "=1.2.3" or "v1.2.3+build" and tidies them.
          version_of() {
            local version
            version=$(semver "$1") && [ "$1" = "v$version" ] && echo "$version"
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Releases are cut from main, not $REF."
              exit 1
            fi
            # The newest full release; pre-releases are not counted from.
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || {
              echo "::error::There is no full release to count from. Publish the first one by hand."
              exit 1
            }
            current=$(version_of "$latest") || { echo "::error::The latest release, $latest, is not tagged vX.Y.Z."; exit 1; }
            version=$(semver --increment "$BUMP" "$current")
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::$tag already exists."
              exit 1
            fi
          else
            tag=$RELEASE_TAG
            version=$(version_of "$tag") || { echo "::error::Release tags look like v1.2.3 or v1.2.3-beta.1, not $tag."; exit 1; }
          fi
          prerelease=false
          if [[ "$version" == *-* || "$RELEASE_PRERELEASE" == true ]]; then prerelease=true; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing $tag."

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Into the runner's copy only; nothing is committed. Every package moves
      # together, as the workspace test requires.
      - name: Stamp the version from the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$VERSION" --workspaces --include-workspace-root --no-git-tag-version

      # The same gate CI runs, at the version being released. It also builds
      # the server and packs the extension.
      - run: npm run check
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}

      # Both files the other jobs need, gathered outside dist/: npm pack
      # rebuilds the server first, and the build empties dist/ as it starts.
      # The npm package is packed here so the publish job uploads exactly this
      # tarball rather than building its own.
      - working-directory: packages/mcp
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp dist/presenter-garage.mcpb "$RUNNER_TEMP/release/"
          npm pack --pack-destination "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  attach:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      # From the button, the release is created here with the extension
      # already on it, so "latest" never points at a release without it. A
      # release made with this job's token starts no other workflow, so this
      # one does not run a second time for it.
      #
      # The tag is created first, at the commit that was built, and creating a
      # ref that already exists fails. Without that, a tag pushed by hand since
      # the version job checked would be reused, since GitHub ignores --target
      # for an existing tag, and the release would name that commit while
      # carrying this build's files.
      - name: Create the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null || {
            echo "::error::Could not create $TAG at $GITHUB_SHA; it may have been made since the version was picked."
            exit 1
          }
          gh release create "$TAG" presenter-garage.mcpb --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes

      - name: Attach the Claude Desktop extension
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" presenter-garage.mcpb --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # After attach, so npm only ever gets a version whose release exists.
    needs: [version, attach]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged with npm for a short-lived publish credential.
      id-token: write
    steps:
      # Only .nvmrc, so this job runs the same Node as the build without
      # holding any of the project's code.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or later.
      - run: npm install -g npm@12

      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Stage the npm package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # npm will not give a prerelease the `latest` tag, and should not.
          DIST_TAG: ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          # npm view sees only approved versions: re-running this before the
          # last stage is approved stages it again, and npm refuses that.
          if npm view "presenter-garage-mcp@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::presenter-garage-mcp@$VERSION is already on npm, so nothing is staged."
          else
            npm stage publish "./presenter-garage-mcp-$VERSION.tgz" --tag "$DIST_TAG"
            echo "::notice::presenter-garage-mcp@$VERSION is staged as $DIST_TAG. Approve it with 'npm stage approve' or on npmjs.com."
          fi
